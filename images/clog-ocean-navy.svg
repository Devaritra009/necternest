<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Studio Mesh Gradient -->
    <radialGradient id="studioDark" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#151E32" />
      <stop offset="55%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#070B13" />
    </radialGradient>
    
    <!-- Cool Spotlight Halo -->
    <radialGradient id="neonHalo" cx="50%" cy="58%" r="48%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070B13" stop-opacity="0"/>
    </radialGradient>

    <!-- Upper Shoe Foam Gradient -->
    <linearGradient id="clogBody" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Sole Platform Gradient -->
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082F49" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <filter id="floatShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="450" fill="url(#studioDark)" rx="24"/>

  <!-- Spotlight Ring -->
  <circle cx="280" cy="225" r="175" fill="url(#neonHalo)"/>

  <!-- Badge Pill -->
  <g transform="translate(36, 32)">
    <rect width="125" height="30" rx="15" fill="#090E1A" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="4.5" fill="#0EA5E9"/>
    <text x="70" y="19" fill="#F8FAFC" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="1">AQUA OUTDOOR</text>
  </g>

  <!-- Floor Contact Shadow -->
  <ellipse cx="295" cy="370" rx="210" ry="24" fill="#000000" opacity="0.7" filter="blur(10px)"/>

  <!-- MAIN CLOG 3D VECTOR -->
  <g filter="url(#floatShadow)" transform="translate(10, 5)">
    <!-- Sole / Midsole Platform (Thick Ergonomic Cushion) -->
    <path d="M 125 315 
             C 140 338, 200 345, 275 345 
             C 365 345, 450 335, 475 310 
             C 485 300, 475 285, 450 282 
             C 410 278, 320 284, 255 288 
             C 195 292, 140 288, 120 298 
             Z" 
          fill="url(#soleGrad)" stroke="#0369A1" stroke-width="2"/>
    
    <!-- Sole Grip Ridges -->
    <path d="M 170 336 L 175 342 M 220 342 L 225 346 M 270 344 L 275 348 M 325 344 L 330 347 M 380 340 L 385 343 M 430 330 L 435 334" 
          stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>

    <!-- Upper Shoe Foam Body -->
    <path d="M 130 295 
             C 120 250, 145 190, 215 175 
             C 275 162, 365 170, 420 215 
             C 460 250, 475 280, 455 295 
             C 435 305, 390 288, 330 285 
             C 260 282, 185 285, 130 295 Z" 
          fill="url(#clogBody)"/>

    <!-- Collar / Ankle Rim Contour -->
    <path d="M 175 220 
             C 200 190, 245 185, 305 195 
             C 330 200, 350 215, 335 230 
             C 310 245, 260 240, 210 238 
             C 185 237, 172 232, 175 220 Z" 
          fill="#0369A1" opacity="0.38"/>

    <!-- Heel Pivoting Turbo Strap -->
    <path d="M 148 270 
             C 135 240, 140 210, 168 198 
             C 192 188, 230 195, 240 208 
             C 246 216, 238 226, 216 226 
             C 190 226, 165 240, 158 266 Z" 
          fill="#0369A1"/>
    
    <!-- Strap Rivet / Logo Button -->
    <circle cx="152" cy="270" r="10" fill="#0B0F17" stroke="#7DD3FC" stroke-width="2.2"/>
    <circle cx="152" cy="270" r="5" fill="#0EA5E9"/>

    <!-- Ventilation Ports (Holes) -->
    <ellipse cx="280" cy="210" rx="6" ry="10" fill="#0369A1" opacity="0.75" transform="rotate(-15 280 210)"/>
    <ellipse cx="320" cy="216" rx="6" ry="11" fill="#0369A1" opacity="0.75" transform="rotate(-10 320 216)"/>
    <ellipse cx="360" cy="230" rx="7" ry="12" fill="#0369A1" opacity="0.75" transform="rotate(5 360 230)"/>
    <ellipse cx="400" cy="254" rx="7" ry="12" fill="#0369A1" opacity="0.75" transform="rotate(20 400 254)"/>

    <ellipse cx="265" cy="238" rx="6" ry="9" fill="#0369A1" opacity="0.75" transform="rotate(-10 265 238)"/>
    <ellipse cx="305" cy="245" rx="6" ry="10" fill="#0369A1" opacity="0.75" transform="rotate(-5 305 245)"/>
    <ellipse cx="350" cy="260" rx="7" ry="11" fill="#0369A1" opacity="0.75" transform="rotate(10 350 260)"/>
    <ellipse cx="390" cy="280" rx="6" ry="9" fill="#0369A1" opacity="0.75" transform="rotate(25 390 280)"/>

    <ellipse cx="230" cy="258" rx="5" ry="8" fill="#0369A1" opacity="0.75" transform="rotate(-5 230 258)"/>
    <ellipse cx="270" cy="270" rx="6" ry="8" fill="#0369A1" opacity="0.75"/>
    <ellipse cx="315" cy="276" rx="6" ry="8" fill="#0369A1" opacity="0.75"/>

    <!-- Jibbitz Street Charm -->
    <g transform="translate(325, 228)">
      <circle cx="14" cy="14" r="16" fill="#0B0F17" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="14" cy="14" r="11" fill="#0EA5E9"/>
      <text x="14" y="19" fill="#000000" font-family="'Outfit', sans-serif" font-size="13" font-weight="900" text-anchor="middle">🌊</text>
    </g>

    <!-- Clean Rim Specular Reflection -->
    <path d="M 385 224 C 430 255, 448 278, 438 294" 
          stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- Bottom Title -->
  <text x="300" y="414" font-family="'Outfit', sans-serif" font-size="19" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="-0.3">Deep Ocean All-Terrain Explorer</text>
  <text x="300" y="433" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">ZERO-GRAVITY CLOUD FOAM • WATERPROOF</text>
</svg>